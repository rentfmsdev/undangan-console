# ==============================================================================
# Nginx Configuration Template for Undangan Console
# Domain: console.undangan.co (Sesuaikan dengan domain Anda)
# ==============================================================================

# 1. HTTP -> HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name console.undangan.co;

    # Let's Encrypt ACME Challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Production HTTPS Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name console.undangan.co;

    # SSL Certificates (Dihasilkan oleh Certbot)
    ssl_certificate /etc/letsencrypt/live/console.undangan.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/console.undangan.co/privkey.pem;

    # Modern SSL Security Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Security Headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Ukuran maksimal upload foto (mendukung hingga 20MB, meski sudah di-downscale oleh client)
    client_max_body_size 20M;

    # --------------------------------------------------------------------------
    # A. Realtime Collaboration WebSocket Gateway
    # --------------------------------------------------------------------------
    location /collaboration-ws {
        # Collab Server berjalan di port 3001
        proxy_pass http://127.0.0.1:3001;

        # WebSocket Upgrade Headers (Wajib)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Forwarding Headers & Authentication Cookie (Wajib untuk sesi auth Yjs)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;

        # Mencegah timeout koneksi WebSocket saat idle (1 jam)
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 60s;
    }

    # --------------------------------------------------------------------------
    # B. Next.js Static Cache Optimization
    # --------------------------------------------------------------------------
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        # Cache statis di browser selama 1 tahun (immutable)
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # --------------------------------------------------------------------------
    # C. Next.js Main Application (Server & API Routes)
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:3000;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;

        # Buffer & Timeout settings
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
        proxy_read_timeout 60s;
    }
}
