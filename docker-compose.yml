name: undangan-console

x-app: &app
  image: undangan-console:local
  pull_policy: build
  build:
    context: .
    dockerfile: Dockerfile
    args:
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      NEXT_PUBLIC_COLLAB_WS_URL: ${NEXT_PUBLIC_COLLAB_WS_URL}
      NEXT_PUBLIC_ADMIN_WHATSAPP: ${NEXT_PUBLIC_ADMIN_WHATSAPP}
      NEXT_PUBLIC_ENABLE_DEV_AUTH: ${NEXT_PUBLIC_ENABLE_DEV_AUTH}
  env_file:
    - .env
  environment:
    NODE_ENV: production
    MYSQL_HOST: ${DOCKER_MYSQL_HOST:-${MYSQL_HOST:-db_users}}
    MYSQL_PORT: ${MYSQL_PORT:-3306}
    NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
    NEXT_PUBLIC_COLLAB_WS_URL: ${NEXT_PUBLIC_COLLAB_WS_URL}
    PORT: 2000
    COLLAB_PORT: 2001
    COLLAB_ALLOWED_ORIGIN: ${COLLAB_ALLOWED_ORIGIN}
    COLLAB_REDIS_HOST: ${DOCKER_COLLAB_REDIS_HOST:-${COLLAB_REDIS_HOST}}
    COLLAB_REDIS_PORT: ${COLLAB_REDIS_PORT}
    COLLAB_REDIS_USERNAME: ${COLLAB_REDIS_USERNAME}
    COLLAB_REDIS_PASSWORD: ${COLLAB_REDIS_PASSWORD}
    COLLAB_REDIS_DATABASE: ${COLLAB_REDIS_DATABASE}
    COLLAB_REDIS_TLS: ${COLLAB_REDIS_TLS}
    PAYMENT_GATEWAY_SERVICE_URL: ${PAYMENT_GATEWAY_SERVICE_URL}
    PAYMENT_CALLBACK_SECRET: ${PAYMENT_CALLBACK_SECRET}
    SUB_MERCHANT_ID: ${SUB_MERCHANT_ID}
  extra_hosts:
    - "host.docker.internal:host-gateway"
  networks:
    - undangan
    - nginx_default
    - sso_users_internal_network

services:
  web:
    <<: *app
    container_name: undangan_web
    restart: unless-stopped
    command: ["npm", "run", "start"]
    init: true
    stop_grace_period: 30s
    ports:
      - "${WEB_PORT:-2000}:2000"
    volumes:
      - uploads:/app/public/uploads
      - wishes:/app/data
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:2000').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  collab:
    <<: *app
    container_name: undangan_collab
    restart: unless-stopped
    command: ["npm", "run", "start:collab"]
    init: true
    stop_grace_period: 15s
    ports:
      - "${COLLAB_PORT:-2001}:2001"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:2001/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  migrate:
    <<: *app
    container_name: undangan_migrate
    command: ["npm", "run", "db:migrate"]
    restart: "no"

volumes:
  uploads:
  wishes:

networks:
  undangan:
    driver: bridge
  nginx_default:
    external: true
  sso_users_internal_network:
    external: true
