<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 40" width="100%" height="100%">
  <defs>
    <linearGradient id="divGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0" />
      <stop offset="25%" stop-color="#d4af37" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#fff5ce" />
      <stop offset="75%" stop-color="#d4af37" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0" />
    </linearGradient>
  </defs>
  <!-- Main Horizontal Line -->
  <line x1="10" y1="20" x2="390" y2="20" stroke="url(#divGold)" stroke-width="1.5" />

  <!-- Center Kawung Diamond Flower -->
  <g transform="translate(200, 20)">
    <!-- 4 Petals of Kawung Motif -->
    <ellipse cx="0" cy="-8" rx="4" ry="7" fill="none" stroke="#d4af37" stroke-width="1.5" />
    <ellipse cx="0" cy="8" rx="4" ry="7" fill="none" stroke="#d4af37" stroke-width="1.5" />
    <ellipse cx="-8" cy="0" rx="7" ry="4" fill="none" stroke="#d4af37" stroke-width="1.5" />
    <ellipse cx="8" cy="0" rx="7" ry="4" fill="none" stroke="#d4af37" stroke-width="1.5" />
    <!-- Center Core & Dots -->
    <circle cx="0" cy="0" r="3" fill="#d4af37" />
    <circle cx="-14" cy="0" r="1.5" fill="#d4af37" />
    <circle cx="14" cy="0" r="1.5" fill="#d4af37" />
    <!-- Small flanking diamonds -->
    <polygon points="-30,20 -33,23 -36,20 -33,17" transform="translate(0, -20)" fill="#d4af37" />
    <polygon points="30,20 33,23 36,20 33,17" transform="translate(0, -20)" fill="#d4af37" />
  </g>
</svg>
