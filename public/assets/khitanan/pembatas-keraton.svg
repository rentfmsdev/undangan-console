<svg width="520" height="64" viewBox="0 0 520 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lineKeraton" x1="0" y1="0" x2="520" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D4AF37" stop-opacity="0"/>
      <stop offset="0.22" stop-color="#D4AF37" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#FFF4CB"/>
      <stop offset="0.78" stop-color="#D4AF37" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#D4AF37" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="goldSheen" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFF5D6"/>
      <stop offset="0.45" stop-color="#D4AF37"/>
      <stop offset="1" stop-color="#916E16"/>
    </linearGradient>
    <linearGradient id="darkGold" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#D4AF37"/>
      <stop offset="1" stop-color="#5E4307"/>
    </linearGradient>
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#D4AF37" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Horizontal Tapered Flourish Lines -->
  <path d="M10 32H165M355 32H510" stroke="url(#lineKeraton)" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M50 32H145M375 32H470" stroke="url(#lineKeraton)" stroke-width="0.8" stroke-linecap="round" stroke-dasharray="3 4"/>

  <!-- Outer Filigree Dots -->
  <circle cx="28" cy="32" r="2" fill="#D4AF37" opacity="0.7"/>
  <circle cx="492" cy="32" r="2" fill="#D4AF37" opacity="0.7"/>
  <circle cx="85" cy="32" r="3" fill="url(#goldSheen)"/>
  <circle cx="435" cy="32" r="3" fill="url(#goldSheen)"/>

  <!-- Flanking Truntum Diamond Stars -->
  <g transform="translate(130, 32)">
    <path d="M0 -6L5 0L0 6L-5 0Z" fill="url(#goldSheen)"/>
    <circle cx="0" cy="0" r="1.5" fill="#1B382B"/>
    <circle cx="-12" cy="0" r="1.8" fill="#D4AF37"/>
    <circle cx="12" cy="0" r="1.8" fill="#D4AF37"/>
  </g>
  <g transform="translate(390, 32)">
    <path d="M0 -6L5 0L0 6L-5 0Z" fill="url(#goldSheen)"/>
    <circle cx="0" cy="0" r="1.5" fill="#1B382B"/>
    <circle cx="-12" cy="0" r="1.8" fill="#D4AF37"/>
    <circle cx="12" cy="0" r="1.8" fill="#D4AF37"/>
  </g>

  <!-- Javanese Symmetrical Lung-Lungan Scrolls (Left Wing) -->
  <g filter="url(#softGlow)">
    <path d="M260 32 C246 22 230 18 214 23 C200 27 194 38 180 34 C170 31 164 22 174 15 C182 9 194 14 191 22 C189 27 181 27 179 23"
          fill="none" stroke="url(#goldSheen)" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M260 32 C246 42 230 46 214 41 C200 37 194 26 180 30 C170 33 164 42 174 49 C182 55 194 50 191 42 C189 37 181 37 179 41"
          fill="none" stroke="url(#goldSheen)" stroke-width="2.2" stroke-linecap="round"/>
    <!-- Leaflet curls -->
    <path d="M236 21 C232 14 222 13 218 18 C222 23 232 23 236 21 Z" fill="url(#goldSheen)"/>
    <path d="M236 43 C232 50 222 51 218 46 C222 41 232 41 236 43 Z" fill="url(#goldSheen)"/>
  </g>

  <!-- Javanese Symmetrical Lung-Lungan Scrolls (Right Wing) -->
  <g filter="url(#softGlow)">
    <path d="M260 32 C274 22 290 18 306 23 C320 27 326 38 340 34 C350 31 356 22 346 15 C338 9 326 14 329 22 C331 27 339 27 341 23"
          fill="none" stroke="url(#goldSheen)" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M260 32 C274 42 290 46 306 41 C320 37 326 26 340 30 C350 33 356 42 346 49 C338 55 326 50 329 42 C331 37 339 37 341 41"
          fill="none" stroke="url(#goldSheen)" stroke-width="2.2" stroke-linecap="round"/>
    <!-- Leaflet curls -->
    <path d="M284 21 C288 14 298 13 302 18 C298 23 288 23 284 21 Z" fill="url(#goldSheen)"/>
    <path d="M284 43 C288 50 298 51 302 46 C298 41 288 41 284 43 Z" fill="url(#goldSheen)"/>
  </g>

  <!-- Centerpiece: Royal Keraton Mahkota & Surya Majapahit Jewel -->
  <g transform="translate(260, 32)" filter="url(#softGlow)">
    <!-- Outer Radiant Rays -->
    <path d="M0 -22 L3 -13 L10 -18 L6 -10 L15 -10 L9 -4 L18 -1 L10 2 L16 8 L8 7 L12 15 L5 11 L6 19 L1 13 L0 22 L-1 13 L-6 19 L-5 11 L-12 15 L-8 7 L-16 8 L-10 2 L-18 -1 L-9 -4 L-15 -10 L-6 -10 L-10 -18 L-3 -13 Z"
          fill="url(#goldSheen)" opacity="0.9"/>

    <!-- Outer Sacred Lotus Petals -->
    <circle cx="0" cy="0" r="10.5" fill="#1B382B" stroke="url(#goldSheen)" stroke-width="2"/>
    <circle cx="0" cy="0" r="7.5" fill="url(#darkGold)"/>

    <!-- Central Faceted Gemstone (Gold Diamond) -->
    <polygon points="0,-6 5.5,0 0,6 -5.5,0" fill="#FFF5D6"/>
    <polygon points="0,-6 5.5,0 0,0" fill="#FFE899"/>
    <polygon points="0,0 5.5,0 0,6" fill="#D4AF37"/>
    <polygon points="-5.5,0 0,0 0,6" fill="#A8811A"/>
    <polygon points="-5.5,0 0,-6 0,0" fill="#FFFBEA"/>
    <circle cx="0" cy="0" r="1.5" fill="#1B382B"/>

    <!-- Small Flanking Drops -->
    <circle cx="-16" cy="0" r="2.2" fill="url(#goldSheen)"/>
    <circle cx="16" cy="0" r="2.2" fill="url(#goldSheen)"/>
  </g>
</svg>
